server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router(history 모드) 새로고침 시 404 방지
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 로컬 개발 시 백엔드로 API 요청 프록시 (Railway 배포 시에는 VITE_API_BASE_URL로 직접 호출)
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
